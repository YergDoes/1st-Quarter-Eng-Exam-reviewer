<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 4 Reviewer — Detailed Flashcards &amp; Quiz</title>
<style>
  :root{
    --bg:#0d1024;
    --surface:#1c2144;
    --surface2:#252b55;
    --line:#333a6b;
    --text:#e9ebf8;
    --muted:#9aa3c9;
    --accent:#f5b731;
    --accent2:#7c5cff;
    --correct:#2ecc71;
    --wrong:#ff5c5c;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%, #2a2160 0%, transparent 55%),
               radial-gradient(1000px 600px at 90% 0%, #123a5c 0%, transparent 50%),
               var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:22px 16px 60px;
    line-height:1.55;
  }
  .app{max-width:960px;margin:0 auto;}

  header{text-align:center;margin-bottom:24px;}
  header h1{
    font-size:clamp(1.5rem,4.5vw,2.2rem);
    letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--accent),#ffd97a,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;
  }
  header p{color:var(--muted);font-size:.85rem;margin-top:6px;}

  .tabs{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .tabs button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:11px 26px;
    border-radius:999px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    transition:.22s;
  }
  .tabs button:hover{color:var(--text);border-color:var(--accent2);}
  .tabs button.active{
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    color:#fff;border-color:transparent;
    box-shadow:0 6px 20px -6px var(--accent2);
  }

  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* DECK BAR */
  .deck-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .deck-bar button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 15px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .deck-bar button:hover{color:var(--text);}
  .deck-bar button.active{
    background:var(--accent);
    color:#221a00;
    border-color:var(--accent);
  }

  /* FLASHCARD */
  .card{
    perspective:1400px;
    height:420px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transition:transform .62s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    padding:30px 26px;
    overflow-y:auto;
    border:1px solid var(--line);
    box-shadow:0 18px 45px -20px #000;
  }
  .card-front{
    background:linear-gradient(160deg,var(--surface2),var(--surface));
  }
  .card-back{
    background:linear-gradient(160deg,#20315a,#1a2447);
    transform:rotateY(180deg);
    border-color:#3c5a99;
  }
  .card-face > div{max-width:100%;}
  .card-label{
    display:block;
    font-size:.7rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:12px;
    text-align:center;
  }
  .card-back .card-label{color:#7fd3ff;}
  .card-face p{
    font-size:clamp(.95rem,2.2vw,1.1rem);
    text-align:center;
    font-weight:500;
  }
  .card-face ul{
    text-align:left;
    font-size:.92rem;
    padding-left:20px;
    margin-top:8px;
  }
  .card-face ul li{margin-bottom:5px;}
  .card-hint{
    text-align:center;color:var(--muted);font-size:.75rem;
    margin-top:8px;margin-bottom:14px;
  }

  .fc-controls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    flex-wrap:wrap;
  }
  .fc-controls button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 20px;
    border-radius:12px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .fc-controls button:hover{background:var(--surface2);border-color:var(--accent2);}
  .fc-controls button:disabled{opacity:.35;cursor:not-allowed;}
  #fcCounter{
    font-size:.85rem;color:var(--muted);font-weight:700;
    min-width:78px;text-align:center;
    font-variant-numeric:tabular-nums;
  }

  /* QUIZ */
  .quiz-top{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-size:.82rem;color:var(--muted);font-weight:600;
  }
  .bar{height:7px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:22px;}
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    border-radius:99px;transition:width .35s ease;
  }
  .q-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px;
    margin-bottom:18px;
  }
  .q-tag{
    display:inline-block;
    font-size:.66rem;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--accent);font-weight:700;
    background:#f5b7311a;
    padding:4px 11px;border-radius:99px;margin-bottom:14px;
  }
  .q-text{font-size:1.05rem;font-weight:600;line-height:1.6;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:14px 18px;
    border-radius:12px;
    font-size:.92rem;
    text-align:left;
    cursor:pointer;
    transition:.18s;
    font-family:inherit;
    line-height:1.5;
    display:flex;gap:12px;align-items:flex-start;
  }
  .opt:hover:not(.locked){background:var(--surface2);border-color:var(--accent2);transform:translateX(3px);}
  .opt .letter{
    font-weight:800;color:var(--accent);flex-shrink:0;min-width:18px;
  }
  .opt.correct{background:#1e5c3a;border-color:var(--correct);}
  .opt.correct .letter{color:#8affc1;}
  .opt.wrong{background:#5c1e1e;border-color:var(--wrong);}
  .opt.wrong .letter{color:#ffb3b3;}
  .opt.locked{cursor:default;}

  .explain{
    margin-top:16px;
    background:#0e1330;
    border-left:3px solid var(--accent);
    padding:13px 16px;
    border-radius:0 10px 10px 0;
    font-size:.87rem;
    color:#c3caea;
    display:none;
  }
  .explain.show{display:block;animation:fade .25s ease;}
  .explain strong{color:var(--accent);}

  #nextQ{
    display:none;
    margin-top:18px;
    width:100%;
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    border:none;color:#fff;
    padding:14px;border-radius:12px;
    font-size:.95rem;font-weight:700;
    cursor:pointer;font-family:inherit;
    transition:.2s;
  }
  #nextQ:hover{filter:brightness(1.15);}
  #nextQ.show{display:block;}

  /* RESULTS */
  .result{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 26px;
    text-align:center;
    display:none;
  }
  .result.show{display:block;animation:fade .4s ease;}
  .score-ring{
    font-size:3.4rem;font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1.1;
  }
  .result h2{margin:10px 0 6px;font-size:1.3rem;}
  .result p{color:var(--muted);font-size:.9rem;margin-bottom:8px;}
  .result .msg{
    font-size:1rem;margin:18px 0 26px;color:var(--text);font-weight:600;
  }
  .result button{
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    border:none;color:#fff;
    padding:13px 32px;border-radius:12px;
    font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;
    transition:.2s;
  }
  .result button:hover{filter:brightness(1.15);}

  @media(max-width:600px){
    .card{height:360px;}
    .card-face{padding:22px 18px;}
    .q-box{padding:20px 16px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>English 4 Reviewer</h1>
    <p>Detailed Story Summaries · Flashcards · Quiz · 1st Quarter</p>
  </header>

  <nav class="tabs">
    <button data-tab="flash" class="active">📇 Flashcards</button>
    <button data-tab="quiz">📝 Quiz</button>
  </nav>

  <!-- FLASHCARDS -->
  <section id="flash" class="panel active">
    <div class="deck-bar" id="deckBar"></div>
    <div class="card" id="card">
      <div class="card-inner">
        <div class="card-face card-front">
          <div>
            <span class="card-label">Question</span>
            <p id="fcQ">Loading…</p>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <span class="card-label">Answer</span>
            <div id="fcA"></div>
          </div>
        </div>
      </div>
    </div>
    <p class="card-hint">Click the card to flip · Use ← → keys to navigate</p>
    <div class="fc-controls">
      <button id="prevBtn">← Prev</button>
      <span id="fcCounter">1 / 1</span>
      <button id="nextBtn">Next →</button>
      <button id="shuffleBtn">🔀 Shuffle</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="panel">
    <div id="quizArea">
      <div class="quiz-top">
        <span id="qProgress">Question 1 of 70</span>
        <span id="qScore">Score: 0</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="q-box">
        <span class="q-tag" id="qTag">Topic</span>
        <p class="q-text" id="qText"></p>
      </div>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain"></div>
      <button id="nextQ">Next Question →</button>
    </div>

    <div class="result" id="result">
      <div class="score-ring" id="scoreRing">0%</div>
      <h2 id="resultTitle">Quiz Complete!</h2>
      <p id="resultSub"></p>
      <p class="msg" id="resultMsg"></p>
      <button id="retryBtn">🔄 Retake Quiz</button>
    </div>
  </section>
</div>

<script>
/* =========================================================
   FLASHCARD DECKS — DETAILED
   ========================================================= */
const DECKS = {

  "Gilgamesh (Detailed)": [
    {q:"Who were Gilgamesh's parents?", a:"His mother was the goddess Ninsun; his father was the mortal king Lugalbanda. He was two-thirds divine and one-third human."},
    {q:"What city did Gilgamesh rule, and what was significant about its walls?", a:"He ruled Uruk, a great walled city. He built magnificent walls that become symbolic of his legacy. The epic opens and closes with praise for Uruk's walls."},
    {q:"How did Gilgamesh oppress the people of Uruk?", a:"He forced young men to labor endlessly on his building projects; he claimed the right to sleep with every new bride before her husband (droit du seigneur); he exhausted his subjects; no one could challenge him."},
    {q:"Who did the people of Uruk pray to for relief?", a:"Anu, the sky god and father of the gods."},
    {q:"Who created Enkidu, and from what?", a:"Aruru, the goddess of creation, fashioned him from clay as a wild man."},
    {q:"Describe Enkidu before civilization.", a:"Covered in hair like an animal; ate grass with gazelles; drank from watering holes with wild beasts; lived in the wilderness; protected animals by destroying hunters' traps."},
    {q:"Who was Shamhat, and what was her role?", a:"A temple prostitute (hierodule/sacred servant of Ishtar). She was sent by Gilgamesh to civilize Enkidu at the watering hole."},
    {q:"What happened to Enkidu after six days and seven nights with Shamhat?", a:"The wild animals fled from him; he could no longer run with the gazelles; but he gained understanding, wisdom, and capacity for human connection. Shamhat taught him to eat bread, drink beer, wear clothes, and anoint with oil."},
    {q:"What were Gilgamesh's two prophetic dreams?", a:"1) A meteor fell from the sky that Gilgamesh loved like a wife. 2) He found an axe in the street and loved it. Ninsun interpreted both as the coming of a companion like a brother."},
    {q:"Describe the wrestling match between Gilgamesh and Enkidu.", a:"They grappled through the streets; doorposts shook and walls trembled; neither could gain advantage — perfectly matched. It ended in a draw; they embraced and became inseparable friends."},
    {q:"Who adopted Enkidu, making him and Gilgamesh brothers?", a:"Ninsun, Gilgamesh's mother, adopted Enkidu as her own son."},
    {q:"Why did Gilgamesh want to go to the Cedar Forest?", a:"He sought eternal fame through heroic deeds, since he could not achieve immortality. He said: 'Who can scale heaven? Only the gods live forever. As for mankind, numbered are their days. Whatever they achieve is but the wind.'"},
    {q:"Who was Humbaba?", a:"A fearsome monster appointed by Enlil to guard the Cedar Forest. His voice was like thunder, his breath was fire, his presence caused paralysis and death; he was said to be immortal."},
    {q:"Who helped Gilgamesh and Enkidu in the battle against Humbaba?", a:"Shamash, the sun god, sent thirteen winds to blind and confuse Humbaba."},
    {q:"What did Humbaba do before he died?", a:"He pleaded for his life, promising to serve Gilgamesh. Enkidu urged Gilgamesh not to listen. Humbaba cursed Enkidu, saying Enkidu would not live long after this deed."},
    {q:"What did Gilgamesh and Enkidu do after killing Humbaba?", a:"They cut down the sacred cedars and floated them down the Euphrates River to Uruk."},
    {q:"Who proposed marriage to Gilgamesh after his return?", a:"Ishtar, the goddess of love and war."},
    {q:"How did Gilgamesh reject Ishtar?", a:"With a blistering insult, reciting her former lovers and how she destroyed each: Tammuz (condemned to underworld), the lion (trapped in pits), the horse (bridle and spur), the shepherd (turned into a wolf), the gardener (turned into a frog)."},
    {q:"What did Ishtar demand from Anu, and what threat did she make?", a:"She demanded the Bull of Heaven to punish Gilgamesh; she threatened to break open the gates of the underworld and release the dead to devour the living if Anu refused."},
    {q:"Describe the destruction caused by the Bull of Heaven.", a:"Its first snort opened a pit swallowing one hundred men; second snort swallowed two hundred; third snort threatened to swallow Enkidu."},
    {q:"How was the Bull of Heaven killed?", a:"Enkidu grabbed it by the horns; Gilgamesh drove his sword into its neck. They cut out its heart and offered it to Shamash."},
    {q:"What did Enkidu do when Ishtar cursed them?", a:"He threw a piece of the bull's thigh at her and shouted insults, saying he would do the same to her if he could."},
    {q:"What did the divine council decide after the killing of Humbaba and the Bull?", a:"Enlil argued Enkidu must die, but Gilgamesh should be spared. Shamash protested, but Enlil was adamant: 'Enkidu must die.'"},
    {q:"How long did Enkidu suffer before dying?", a:"Twelve days. He was tormented by nightmares of the underworld — a place of dust and darkness where the dead eat clay and drink mud."},
    {q:"How did Gilgamesh grieve for Enkidu?", a:"He refused to allow anyone to bury his friend for seven days and seven nights. He wept: 'My friend, whom I loved, has turned to clay. Shall I not be like him?'"},
    {q:"Who was Utnapishtim?", a:"The only mortal granted immortality by the gods. Gilgamesh sought him to learn the secret of eternal life."},
    {q:"What obstacles did Gilgamesh face on his journey to Utnapishtim?", a:"Scorpion-men guarding a mountain pass; a tunnel of darkness (twelve leagues); a garden of jewels; the great sea that encircles the world."},
    {q:"Who was Siduri, and what advice did she give?", a:"A divine tavern keeper by the sea. She advised: 'When the gods created man, they allotted to him death, but life they retained. Fill your belly with good things; day and night, dance and be merry, feast and rejoice... for this too is the lot of man.'"},
    {q:"Who was Urshanabi?", a:"The boatman of Utnapishtim who ferried Gilgamesh across the waters of death."},
    {q:"What was Utnapishtim's former city?", a:"Shurrupak, which stood on the banks of the Euphrates River."},
    {q:"Why did the gods decide to send the flood?", a:"The world had become too noisy — the clamor of humans disturbed the gods' sleep. Enlil convinced the divine council to send a flood."},
    {q:"How did Ea warn Utnapishtim?", a:"He whispered the secret through the walls of Utnapishtim's reed house: 'Reed-house, reed-house! Wall, O wall... tear down your house and build a boat, abandon possessions and look for life.'"},
    {q:"What were the dimensions of Utnapishtim's boat?", a:"A perfect cube, each side 120 cubits (approximately 180 feet), with seven decks, divided into nine sections."},
    {q:"What did Utnapishtim load into the boat?", a:"All his gold and silver, his family and relatives, the seeds of all living creatures, wild and tame animals, and the craftsmen who helped build the boat."},
    {q:"How long did the flood storm rage?", a:"Six days and six nights. On the seventh day, the storm subsided and the sea grew calm."},
    {q:"Where did Utnapishtim's boat land?", a:"On Mount Nisir (also called Nimush). The boat held fast for seven days."},
    {q:"What three birds did Utnapishtim send out, and what happened?", a:"1) Dove — found no resting place, returned. 2) Swallow — found no resting place, returned. 3) Raven — saw waters retreated, ate, flew around, cawed, and did not return."},
    {q:"What did Utnapishtim do after the flood?", a:"He opened the boat to the four winds, made a sacrifice on the mountain top — seven cauldrons, wood, cane, cedar, and myrtle. The gods smelled the sweet savor and gathered like flies."},
    {q:"What did Ishtar do at the sacrifice?", a:"She swore by her necklace of lapis lazuli that she would remember these days, and invited all the gods except Enlil, who brought the flood without reflection."},
    {q:"How did Ea rebuke Enlil?", a:"'How could you so senselessly bring down the flood? Lay upon the sinner his sin... Would that a lion had ravaged mankind rather than the flood... Would that pestilence had wasted mankind rather than the flood.'"},
    {q:"What reward did Enlil give Utnapishtim?", a:"He blessed Utnapishtim and his wife: 'Henceforth he and his wife shall live in the distance at the mouth of the rivers.' They were granted immortality."},
    {q:"What test did Utnapishtim give Gilgamesh?", a:"To prevail against sleep for six days and seven nights. Gilgamesh immediately fell asleep. Utnapishtim's wife baked a loaf each day and marked the wall."},
    {q:"What did the loaves show?", a:"The first was hard, second like leather, third soggy, fourth moldy, fifth mildewed, sixth fresh, seventh still on the embers — proving Gilgamesh slept the entire time."},
    {q:"What secret did Utnapishtim reveal about a plant?", a:"A plant that grows under the water, with a prickle like a thorn, that restores lost youth to a man. It would not grant immortality, but renewal."},
    {q:"How did Gilgamesh retrieve the plant?", a:"He opened the sluices, tied heavy stones to his feet, dragged himself to the water-bed, saw the plant, took it despite the pricks, cut the stones, and was thrown onto the shore."},
    {q:"What happened to the youth-restoring plant?", a:"While Gilgamesh bathed in a cool well, a serpent sensed the sweetness, rose from the water, snatched the plant, and immediately sloughed its skin — symbolizing the renewal Gilgamesh sought."},
    {q:"What did Gilgamesh learn about immortality?", a:"True immortality is not living forever but the lasting legacy of one's works — the walls of Uruk, the city, the story itself."},
    {q:"What are the central themes of the Epic of Gilgamesh?", a:"1) The inevitability of death. 2) The value of friendship. 3) The search for meaning. 4) The limits of human power. 5) Legacy as immortality."},
    {q:"What did the narrator say about Gilgamesh at the end?", a:"'He was wise, he saw mysteries and knew secret things, he brought us a tale of the days before the flood. He went a long journey, was weary, worn out with labor, and returning engraved on a stone the whole story.'"}
  ],

  "Book of Job (Detailed)": [
    {q:"How is Job described at the opening of the book?", a:"'Blameless and upright, one who feared God and turned away from evil.' He was the greatest of all the people of the east."},
    {q:"How many children did Job have?", a:"Seven sons and three daughters (symbolizing completeness)."},
    {q:"What was Job's initial wealth?", a:"7,000 sheep, 3,000 camels, 500 yoke of oxen, 500 she-asses, and very many servants."},
    {q:"What did Job do after his sons held feasts?", a:"He sent for them to sanctify them, rose early, and offered burnt offerings for each — saying 'It may be that my sons have sinned and cursed God in their hearts.' He even sacrificed for sins of thought."},
    {q:"What is the 'divine council' scene?", a:"The sons of God (heavenly beings) present themselves before the LORD, and Satan (the Accuser/Adversary) comes among them. He functions as a prosecuting attorney in the divine court."},
    {q:"What did God say to Satan about Job?", a:"'Have you considered my servant Job, that there is none like him on the earth, a blameless and upright man, who fears God and turns away from evil?'"},
    {q:"What was Satan's challenge to God?", a:"'Does Job fear God for nought? You have blessed the work of his hands... Put forth your hand now, and touch all that he has, and he will curse you to your face.' — Job's faith was transactional, not genuine."},
    {q:"What was the first wager?", a:"God gave Satan power over all Job's possessions but forbade touching Job himself."},
    {q:"Who brought the four messages of disaster?", a:"Four messengers, each arriving while the previous was still speaking."},
    {q:"What did the first messenger report?", a:"The Sabeans fell upon the oxen and asses, took them, and slew the servants."},
    {q:"What did the second messenger report?", a:"The fire of God fell from heaven and burned up the sheep and the servants."},
    {q:"What did the third messenger report?", a:"The Chaldeans formed three companies, raided the camels, and slew the servants."},
    {q:"What did the fourth messenger report?", a:"A great wind came across the wilderness, struck the four corners of the house, and it fell on the young people — all ten children died."},
    {q:"How did Job respond to the first wave of disasters?", a:"He arose, rent his robe, shaved his head, fell upon the ground, and worshiped: 'Naked I came from my mother's womb, and naked shall I return; the LORD gave, and the LORD has taken away; blessed be the name of the LORD.' He did not sin or charge God with wrong."},
    {q:"What was the second wager?", a:"Satan said: 'Skin for skin! All that a man has he will give for his life. Touch his bone and his flesh, and he will curse you to your face.' God permitted it but forbade death."},
    {q:"How was Job afflicted in the second test?", a:"With loathsome sores (boils) from the sole of his foot to the crown of his head. He sat among the ashes, scraping himself with a potsherd."},
    {q:"What did Job's wife say to him?", a:"'Do you still hold fast your integrity? Curse God, and die.' (The Hebrew literally says 'bless God' — a euphemism for cursing, a bitter irony.)"},
    {q:"How did Job answer his wife?", a:"'You speak as one of the foolish women would speak. Shall we receive good at the hand of God, and shall we not receive evil?' He did not sin with his lips."},
    {q:"Who were Job's three friends?", a:"Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite."},
    {q:"What did the friends do when they first saw Job?", a:"They did not recognize him, raised their voices and wept, rent their robes, sprinkled dust on their heads, and sat with him on the ground for seven days and seven nights without speaking a word."},
    {q:"What did Job do in Chapter 3?", a:"He cursed the day of his birth, called for darkness to swallow it, longed for death, and asked why life is given to those in misery. He did not curse God directly."},
    {q:"What was Eliphaz's main argument?", a:"The innocent do not perish; those who plow iniquity reap the same. If Job is suffering, he must have sinned. He claimed a night vision revealed that no mortal can be righteous before God."},
    {q:"What was Bildad's main argument?", a:"God does not pervert justice. Job's children died for their transgression. If Job repents, God will restore him. He appealed to the wisdom of the ancients."},
    {q:"What was Zophar's main argument?", a:"Job is full of talk and should be shamed. God exacts less than Job's guilt deserves — Job is getting off easy. He urged Job to repent."},
    {q:"How did Job respond to his friends' arguments?", a:"With raw honesty and sarcasm: 'No doubt you are the people, and wisdom will die with you.' He maintained his innocence and longed for a mediator between himself and God."},
    {q:"What did Job call his friends?", a:"'Miserable comforters' — 'Shall windy words have an end?' He said they were like a treacherous torrent-bed, offering no real help."},
    {q:"What important declaration does Job make in Job 19:25-27?", a:"'For I know that my Redeemer lives, and at last he will stand upon the earth; and after my skin has been thus destroyed, yet in my flesh I shall see God.' — A hope that a Vindicator will stand up for him."},
    {q:"How does Job challenge the friends' theology in Chapter 21?", a:"'Why do the wicked live, reach old age, and grow mighty in power?' He points out that wicked people often prosper, contradicting the retributive justice principle."},
    {q:"What false accusations does Eliphaz make in Chapter 22?", a:"That Job exacted pledges from brothers, stripped the naked, withheld water from the weary, and withheld bread from the hungry."},
    {q:"What does Job long for in Chapter 23?", a:"'Oh, that I knew where I might find him, that I might come even to his seat! I would lay my case before him.' But God is hidden — 'I go forward, but he is not there.'"},
    {q:"What is Job's Oath of Innocence in Chapter 31?", a:"A list of sins he has NOT committed: falsehood, adultery, injustice to servants, neglect of the poor, greed, idolatry, vindictiveness, inhospitality. He signs his defense and demands the Almighty answer."},
    {q:"Who is Elihu, and what is his perspective?", a:"A young man, son of Barachel the Buzite, who was angry at Job and the three friends. He argued: 1) Suffering is God's discipline. 2) God's justice is beyond human understanding. 3) Humans should not demand explanations from God."},
    {q:"How does God answer Job?", a:"Out of the whirlwind. God does not answer Job's questions directly but asks a torrent of rhetorical questions demonstrating divine wisdom and human limitation."},
    {q:"What are some of God's questions about creation?", a:"'Where were you when I laid the foundation of the earth? Who shut in the sea with doors? Have you commanded the morning? Have you entered the storehouses of the snow? Can you bind the chains of the Pleiades?'"},
    {q:"What animals does God ask about in Chapter 39?", a:"Mountain goats, wild ass, wild ox, ostrich, horse, hawk, and eagle — demonstrating God's wisdom encompasses all creation."},
    {q:"How does Job respond to God's first speech?", a:"'Behold, I am of small account; what shall I answer thee? I lay my hand on my mouth. I have spoken once, and I will not answer; twice, but I will proceed no further.'"},
    {q:"What does God say about Behemoth?", a:"A fearsome creature made by God, with bones like tubes of bronze and limbs like bars of iron — 'the first of the works of God.' Humans cannot control it."},
    {q:"What does God say about Leviathan?", a:"A fearsome creature of chaos that cannot be tamed by humans but is part of God's creation. God's point: if Job cannot control these creatures, how can he judge God's governance?"},
    {q:"What is Job's final response to God?", a:"'I know that thou canst do all things... I have uttered what I did not understand... I had heard of thee by the hearing of the ear, but now my eye sees thee; therefore I despise myself, and repent in dust and ashes.'"},
    {q:"How does God judge the three friends?", a:"'My wrath is kindled against you... for you have not spoken of me what is right, as my servant Job has.' He ordered them to offer seven bulls and seven rams, and Job prayed for them."},
    {q:"How was Job restored?", a:"When he prayed for his friends, the LORD restored his fortunes and gave him twice as much as before: 14,000 sheep, 6,000 camels, 1,000 yoke of oxen, 1,000 she-asses."},
    {q:"What were the names of Job's three daughters?", a:"Jemimah ('dove'), Keziah ('cassia' or 'cinnamon'), and Keren-happuch ('horn of eye-paint'). They were the most beautiful women in all the land."},
    {q:"What unusual thing did Job do for his daughters?", a:"He gave them an inheritance among their brothers — normally daughters did not inherit."},
    {q:"How long did Job live after his restoration?", a:"140 years. He saw his sons, and his sons' sons, four generations. He died an old man, full of days."},
    {q:"What are the central themes of the Book of Job?", a:"1) The problem of innocent suffering. 2) The limits of human wisdom. 3) The nature of true faith (not transactional). 4) The danger of theological arrogance. 5) The possibility of encounter with God. 6) The vindication of the sufferer."}
  ],

  "Oedipus Rex (Detailed)": [
    {q:"Who wrote Oedipus Rex, and when?", a:"Sophocles, around 429 BCE. It was first runner-up at the festival of Dionysus in Athens."},
    {q:"What was the curse on Laius?", a:"Laius had wronged Pelops, son of King Tantalus. Pelops cursed Laius: if he ever had a son, that son would kill him."},
    {q:"What did the Delphic Oracle tell Laius?", a:"His son would kill him and marry his own mother."},
    {q:"Why was Oedipus abandoned as a baby?", a:"Laius pierced the infant's ankles (Oedipus means 'swollen foot') and gave him to a shepherd to expose on Mount Cithaeron."},
    {q:"How was Oedipus saved?", a:"The shepherd pitied the child and gave him to another shepherd from Corinth, who brought him to King Polybus and Queen Merope, who raised him as their own."},
    {q:"What did the Oracle tell Oedipus as a young man?", a:"That he was fated to kill his father and marry his mother. Horrified, he fled Corinth."},
    {q:"What happened at the crossroads?", a:"Oedipus encountered Laius in a chariot. Laius tried to push him off the road. Oedipus, in a rage, killed Laius and his servants — not knowing Laius was his father."},
    {q:"What was the Sphinx, and what was her riddle?", a:"A monster with a woman's head, lion's body, and eagle's wings. Her riddle: 'What walks on four legs in the morning, two legs at noon, and three legs in the evening?'"},
    {q:"How did Oedipus solve the Sphinx's riddle?", a:"He answered 'Man' — who crawls as a baby, walks upright as an adult, and uses a cane in old age. The Sphinx killed herself."},
    {q:"What happened after Oedipus saved Thebes?", a:"He was made king and married the widowed queen, Jocasta — not knowing she was his mother. They had four children: Eteocles, Polynices, Antigone, and Ismene."},
    {q:"What is the situation at the opening of the play?", a:"A plague has struck Thebes. Citizens gather at the altars with suppliant branches, led by a priest of Zeus, seeking divine aid."},
    {q:"What does the priest say about the plague?", a:"'A blight is on the fruitful plants of the earth... a deadly pestilence is on our town... the house of Cadmus is emptied of its people while black Death grows rich in groaning and lamentation.'"},
    {q:"What action has Oedipus already taken?", a:"He has sent Creon, his brother-in-law, to the Delphic Oracle to learn how the city might be saved."},
    {q:"What does Creon report from the Oracle?", a:"The murderer of Laius must be found and punished. Only then will the plague be lifted."},
    {q:"What did the survivor of Laius's attack claim?", a:"That robbers — many men — killed Laius at a crossroads."},
    {q:"Why was the murder not investigated at the time?", a:"The Sphinx was terrorizing the city, and all attention was focused on solving her riddle."},
    {q:"What does Oedipus vow?", a:"'I will bring this to light again... I will be an ally, a champion of my country and the God.'"},
    {q:"Who is Tiresias?", a:"A blind prophet who is said to see more than any sighted person. He is reluctant to reveal what he knows."},
    {q:"What does Tiresias finally reveal?", a:"'I say you are the murderer of the king whose murderer you seek.'"},
    {q:"How does Oedipus react to Tiresias?", a:"With outrage. He accuses Tiresias and Creon of plotting to seize power, mocks Tiresias's blindness, and boasts of solving the Sphinx's riddle by his own wit."},
    {q:"What is Tiresias's devastating prophecy?", a:"'You have your eyes but see not where you are in sin... You are an enemy to kith and kin... A deadly footed, double striking curse shall drive you forth... He shall be proved father and brother both to his own children; to her that gave him birth, a son and husband both.'"},
    {q:"What does Oedipus accuse Creon of?", a:"Conspiracy — plotting with Tiresias to seize power."},
    {q:"How does Creon defend himself?", a:"'May I die accursed, if I have been guilty of one tittle of the charge you bring against me!' He argues logically and refuses to be provoked."},
    {q:"Who intervenes in the quarrel?", a:"Jocasta, Oedipus's wife and Creon's sister, who tries to make peace."},
    {q:"How does Jocasta try to comfort Oedipus?", a:"By dismissing prophecy: 'Human beings have no part in the craft of prophecy.' She tells him the oracle about Laius was false — Laius was killed by robbers, not by his son."},
    {q:"What details of Laius's death alarm Oedipus?", a:"The murder happened at a crossroads in Phocis; Laius was tall with grizzled hair; there were five people including a herald and one carriage."},
    {q:"What is Oedipus's story about his past?", a:"Polybus was his father, Merope his mother. A drunk accused him of being a bastard. He went to Delphi and was told he would kill his father and marry his mother. He fled Corinth to avoid this fate."},
    {q:"What happened at the crossroads according to Oedipus?", a:"He was encountered by a herald and a carriage. The old man struck him on the head with a goad. Oedipus became angry and killed them all."},
    {q:"What hope remains for Oedipus?", a:"The survivor said robbers — many men — killed Laius. If there were many killers, Oedipus could not be the murderer."},
    {q:"Who arrives from Corinth, and what news?", a:"A messenger arrives with news that Polybus is dead. Jocasta is overjoyed, thinking the prophecy is proven false."},
    {q:"What does the messenger reveal?", a:"That Polybus was not Oedipus's biological father. The messenger himself gave Oedipus to Polybus as a gift. Oedipus was found on Cithaeron's slopes."},
    {q:"What evidence of Oedipus's identity does the messenger cite?", a:"The scars on Oedipus's ankles — the tendons of his feet were pierced and fettered, which is why he is called Oedipus ('swollen foot')."},
    {q:"What does Jocasta realize?", a:"She realizes the truth before Oedipus does. She begs him: 'I beg you — do not hunt this out — I beg you, if you have any care for your own life.'"},
    {q:"How does Oedipus misunderstand Jocasta's plea?", a:"He thinks she is ashamed of his low birth: 'Keep up your heart, Jocasta. Though I'm proved a slave, thrice slave, you'll not be shown to be of lowly lineage.'"},
    {q:"What does Jocasta cry out before running into the palace?", a:"'O Oedipus, God help you! God keep you from the knowledge of who you are!'"},
    {q:"Who is brought forward to testify?", a:"The old herdsman — the same man who was the survivor of Laius's attack."},
    {q:"What does the herdsman finally reveal?", a:"He gave the child to the messenger. The child was from the house of Laius. Jocasta gave him the child to 'make away with it' through fear of evil oracles. He pitied the child and gave it to the messenger."},
    {q:"What does Oedipus cry out when the truth is complete?", a:"'O, O, O, they will all come, all come out clearly! Light of the sun, let me look upon you no more after today! I who first saw the light bred of a match accursed... cursed in my killing.'"},
    {q:"How does Jocasta die?", a:"She hangs herself in the marriage bed, tearing her hair and cursing the bed where she brought forth husband by her husband, children by her own child."},
    {q:"How does Oedipus blind himself?", a:"He tore the gold brooches from Jocasta's robe and dashed them on his own eyeballs, shrieking that they would never see the crime he had committed. He struck again and again until the bleeding eyeballs gushed."},
    {q:"What does Oedipus say about his blinding?", a:"'It was Apollo, friends, Apollo, that brought this bitter bitterness. But the hand that struck me was none but my own. Why should I see whose vision showed me nothing sweet to see?'"},
    {q:"Who becomes ruler of Thebes at the end?", a:"Creon, Jocasta's brother."},
    {q:"What does Oedipus ask Creon to do?", a:"Drive him out of Thebes; let him live on Mount Cithaeron where he should have died as a child. He also asks Creon to bury Jocasta and protect his daughters, Antigone and Ismene."},
    {q:"What does Oedipus say about his daughters?", a:"'I weep for you — I cannot see your faces... who will marry you? No one, my children; clearly you are doomed to waste away in barrenness unmarried.'"},
    {q:"What are the central themes of Oedipus Rex?", a:"1) Fate vs. free will. 2) Blindness vs. sight (Tiresias blind but sees truth; Oedipus sighted but blind to truth). 3) Hubris (pride). 4) The quest for truth. 5) The limits of human intelligence. 6) The tragic hero. 7) Guilt and innocence."},
    {q:"What is the famous final line of the play?", a:"'Count no man happy until he has passed beyond life's final day.'"}
  ],

  "Greek Tragedy Terms": [
    {q:"What is hamartia?", a:"The hero's flaw that leads to his tragic downfall — a personal error or decision, not an accident."},
    {q:"What is hubris?", a:"The hero's arrogance or excessive pride — a disrespect for the natural order of the world."},
    {q:"What is peripeteia?", a:"The reversal of fate or fortune — the hero's experience of a complete reversal."},
    {q:"What is anagnorisis?", a:"The pivotal moment in which the hero reaches a realization or important discovery."},
    {q:"What is nemesis?", a:"The unavoidable fate of the hero, usually caused by his own hubris — literally 'revenge' or cosmic payback."},
    {q:"What is catharsis?", a:"The audience's release of negative emotions such as pity and fear toward the end of the play — a purification or purging."},
    {q:"What are the six elements of a tragedy?", a:"Plot, Characters, Thought, Diction, Song, and Spectacle."},
    {q:"Which element is the 'soul of tragedy'?", a:"Plot — the most important element where the arrangement of incidents and actions exists."},
    {q:"What is the prologue?", a:"The opening monologue or dialogue before the entrance of the chorus; presents the background of the play."},
    {q:"What is the parados?", a:"The entrance of the chorus through expressive songs and dances that leads up to the main theme."},
    {q:"What is an episode?", a:"The central part of the play where the chorus and actors interact through dialogues. Typically 3-5 episodes."},
    {q:"What is a stasimon?", a:"The section where the chorus gives comment or reaction to the episodes."},
    {q:"What is the exodus?", a:"The concluding part of the play and the final song of the chorus where the moral is revealed."},
    {q:"What are the three principles of a Greek tragedy?", a:"1) It should evoke pity and fear. 2) The tragic hero must be essentially admirable and good. 3) The hero's demise must come from personal error or decision."},
    {q:"What is the difference between simple and complex plot?", a:"Simple — consists of 'change of fortune' (catastrophe). Complex — involves both 'plot reversal' (peripeteia) and 'tragic recognition' (anagnorisis)."}
  ],

  "Gilgamesh & Job Comparisons": [
    {q:"How does the Gilgamesh flood compare to Noah's flood?", a:"Both feature: divine decision to flood; a chosen survivor warned; a boat; birds sent out (dove, swallow, raven vs. dove, raven); a sacrifice; gods who regret. Gilgamesh's is older (Sumerian)."},
    {q:"What do Gilgamesh and Job have in common?", a:"Both are righteous/good men who suffer greatly. Both question the gods/God. Both receive a form of restoration. Both explore the meaning of suffering."},
    {q:"How do Gilgamesh and Job differ in their responses to suffering?", a:"Gilgamesh grieves and seeks immortality. Job grieves and demands an explanation. Gilgamesh learns to accept mortality. Job learns humility and encounters God."},
    {q:"What is theodicy?", a:"The question of why a good God permits suffering — a central theme in the Book of Job."},
    {q:"What is the key difference between Gilgamesh's and Job's endings?", a:"Gilgamesh returns to Uruk with wisdom and accepts mortality. Job is restored with double wealth and lives 140 more years."},
    {q:"How are both stories similar in their view of the divine?", a:"Both show gods/God as powerful and beyond human understanding. Both show that humans cannot fully comprehend divine purposes."}
  ],

  "Business & Resume": [
    {q:"What is a business letter?", a:"A formal correspondence serving as written communication among customers, clients, stakeholders, investors, and other commercial purposes."},
    {q:"What are the seven parts of a business letter?", a:"Heading, Date Line, Inside Address, Salutation, Body, Complimentary Close, and Signature."},
    {q:"What are the four business letter styles?", a:"Full Block, Modified Block, Semi-Block, and Simplified."},
    {q:"Describe the Full Block style.", a:"Every component is aligned to the left. It is the most popular because of its simplicity."},
    {q:"Describe the Modified Block style.", a:"The date line, complimentary close, and signature are typed at the right side of the page."},
    {q:"Resume vs. CV?", a:"Resume — concise (1-2 pages) of experiences, education, and skills. CV ('course life') — in-depth (2+ pages) covering career path, distinctions, publications, awards; static."},
    {q:"What are the three resume formats?", a:"Chronological, Functional, and Combination (Hybrid)."},
    {q:"When should you use the chronological format?", a:"When demonstrating career progress, showing little work experience gaps, or applying for related work."},
    {q:"When is the functional format best?", a:"For students with fewer work experiences but relevant skills, career shifts, or multiple gaps."},
    {q:"What are the parts of an email?", a:"Sender (From), Recipient (To), Subject Line, Salutation, Body, Attachment, and Closing."},
    {q:"What does Cc stand for?", a:"Carbon copy — allows recipients to see other recipients who received a copy."},
    {q:"What does Bcc stand for?", a:"Blind carbon copy — prevents recipients from knowing other recipients."},
    {q:"What does P.S. stand for?", a:"Postscript — an additional remark other than the message in the body."},
    {q:"What are the four body paragraphs of an application letter?", a:"Opening (position + how you learned of it), Second (interest + skills), Third (why best fit + refer to resume), Closing (gratitude + contact details)."},
    {q:"Hard skills vs. Soft skills?", a:"Hard skills — abilities acquired through training (technical). Soft skills — natural personal traits (integrity, teamwork, adaptability)."}
  ]

/* =========================================================
   FLASHCARD LOGIC
   ========================================================= */
const deckBar = document.getElementById('deckBar');
const cardEl = document.getElementById('card');
const fcQ = document.getElementById('fcQ');
const fcA = document.getElementById('fcA');
const fcCounter = document.getElementById('fcCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

let currentDeck = Object.keys(DECKS)[0];
let cardList = [...DECKS[currentDeck]];
let cardIndex = 0;

function buildDeckBar(){
  deckBar.innerHTML = '';
  Object.keys(DECKS).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name + ' (' + DECKS[name].length + ')';
    if(name === currentDeck) b.classList.add('active');
    b.addEventListener('click', () => {
      currentDeck = name;
      cardList = [...DECKS[name]];
      cardIndex = 0;
      buildDeckBar();
      renderCard();
    });
    deckBar.appendChild(b);
  });
}

function renderCard(){
  cardEl.classList.remove('flipped');
  const c = cardList[cardIndex];
  fcQ.textContent = c.q;
  fcA.innerHTML = typeof c.a === 'string' ? '<p>' + c.a + '</p>' : c.a;
  fcCounter.textContent = (cardIndex + 1) + ' / ' + cardList.length;
  prevBtn.disabled = cardIndex === 0;
  nextBtn.disabled = cardIndex === cardList.length - 1;
}

cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
prevBtn.addEventListener('click', () => { if(cardIndex > 0){ cardIndex--; renderCard(); }});
nextBtn.addEventListener('click', () => { if(cardIndex < cardList.length - 1){ cardIndex++; renderCard(); }});
shuffleBtn.addEventListener('click', () => {
  for(let i = cardList.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cardList[i], cardList[j]] = [cardList[j], cardList[i]];
  }
  cardIndex = 0;
  renderCard();
});

document.addEventListener('keydown', e => {
  if(!document.getElementById('flash').classList.contains('active')) return;
  if(e.key === 'ArrowLeft'){ prevBtn.click(); }
  if(e.key === 'ArrowRight'){ nextBtn.click(); }
  if(e.key === ' '){ e.preventDefault(); cardEl.classList.toggle('flipped'); }
});

   QUIZ LOGIC
   ========================================================= */
const qText = document.getElementById('qText');
const qTag = document.getElementById('qTag');
const optsEl = document.getElementById('opts');
const explainEl = document.getElementById('explain');
const nextQ = document.getElementById('nextQ');
const qProgress = document.getElementById('qProgress');
const qScore = document.getElementById('qScore');
const barFill = document.getElementById('barFill');
const quizArea = document.getElementById('quizArea');
const resultEl = document.getElementById('result');
const scoreRing = document.getElementById('scoreRing');
const resultSub = document.getElementById('resultSub');
const resultMsg = document.getElementById('resultMsg');
const resultTitle = document.getElementById('resultTitle');

let quizOrder = [];
let qIndex = 0;
let score = 0;
let answered = false;

function initQuiz(){
  quizOrder = QUIZ.map((q, i) => i);
  for(let i = quizOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [quizOrder[i], quizOrder[j]] = [quizOrder[j], quizOrder[i]];
  }
  qIndex = 0; score = 0; answered = false;
  quizArea.style.display = 'block';
  resultEl.classList.remove('show');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = QUIZ[quizOrder[qIndex]];
  qTag.textContent = q.t;
  qText.textContent = q.q;
  qProgress.textContent = 'Question ' + (qIndex + 1) + ' of ' + quizOrder.length;
  qScore.textContent = 'Score: ' + score;
  barFill.style.width = ((qIndex) / quizOrder.length * 100) + '%';
  explainEl.classList.remove('show');
  explainEl.innerHTML = '';
  nextQ.classList.remove('show');
  nextQ.textContent = (qIndex === quizOrder.length - 1) ? 'See Results →' : 'Next Question →';

  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', () => selectAnswer(i));
    optsEl.appendChild(btn);
  });
}

function selectAnswer(choice){
  if(answered) return;
  answered = true;
  const q = QUIZ[quizOrder[qIndex]];
  const buttons = optsEl.querySelectorAll('.opt');

  buttons.forEach((b, i) => {
    b.classList.add('locked');
    if(i === q.c) b.classList.add('correct');
    if(i === choice && choice !== q.c) b.classList.add('wrong');
  });

  if(choice === q.c){
    score++;
    qScore.textContent = 'Score: ' + score;
  }

  explainEl.innerHTML = '<strong>' + (choice === q.c ? '✓ Correct!' : '✗ Not quite.') + '</strong> ' + q.e;
  explainEl.classList.add('show');
  nextQ.classList.add('show');
}

nextQ.addEventListener('click', () => {
  if(qIndex < quizOrder.length - 1){
    qIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizArea.style.display = 'none';
  resultEl.classList.add('show');
  const pct = Math.round(score / quizOrder.length * 100);
  scoreRing.textContent = pct + '%';
  resultSub.textContent = 'You got ' + score + ' out of ' + quizOrder.length + ' correct.';

  let msg = '';
  if(pct === 100) msg = '🏆 Perfect score! You have mastered this material.';
  else if(pct >= 85) msg = '⭐ Excellent work! Just a few details to review.';
  else if(pct >= 70) msg = '👍 Good job! Review the missed items and try again.';
  else if(pct >= 50) msg = '📖 Fair. Go back to the flashcards and retake the quiz.';
  else msg = '💪 Keep studying! Use the flashcards to strengthen your recall.';
  resultMsg.textContent = msg;
  resultTitle.textContent = 'Quiz Complete!';
}

document.getElementById('retryBtn').addEventListener('click', initQuiz);

/* =========================================================
   TABS
   ========================================================= */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* =========================================================
   INIT
   ========================================================= */
buildDeckBar();
renderCard();
initQuiz();
</script>
</body>
</html>
