<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 4 Reviewer — Flashcards &amp; Quiz</title>
<style>
  :root{
    --bg:#0d1024;
    --bg2:#161a38;
    --surface:#1c2144;
    --surface2:#252b55;
    --line:#333a6b;
    --text:#e9ebf8;
    --muted:#9aa3c9;
    --accent:#f5b731;
    --accent2:#7c5cff;
    --correct:#2ecc71;
    --wrong:#ff5c5c;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%, #2a2160 0%, transparent 55%),
               radial-gradient(1000px 600px at 90% 0%, #123a5c 0%, transparent 50%),
               var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:22px 16px 60px;
    line-height:1.55;
  }
  .app{max-width:900px;margin:0 auto;}

  header{text-align:center;margin-bottom:24px;}
  header h1{
    font-size:clamp(1.5rem,4.5vw,2.2rem);
    letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--accent),#ffd97a,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;
  }
  header p{color:var(--muted);font-size:.85rem;margin-top:6px;}

  .tabs{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .tabs button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:11px 26px;
    border-radius:999px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    transition:.22s;
  }
  .tabs button:hover{color:var(--text);border-color:var(--accent2);}
  .tabs button.active{
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    color:#fff;border-color:transparent;
    box-shadow:0 6px 20px -6px var(--accent2);
  }

  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- DECK BAR ---------- */
  .deck-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .deck-bar button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 15px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .deck-bar button:hover{color:var(--text);}
  .deck-bar button.active{
    background:var(--accent);
    color:#221a00;
    border-color:var(--accent);
  }

  /* ---------- FLASHCARD ---------- */
  .card{
    perspective:1400px;
    height:400px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transition:transform .62s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    padding:30px 26px;
    overflow-y:auto;
    border:1px solid var(--line);
    box-shadow:0 18px 45px -20px #000;
  }
  .card-front{
    background:linear-gradient(160deg,var(--surface2),var(--surface));
  }
  .card-back{
    background:linear-gradient(160deg,#20315a,#1a2447);
    transform:rotateY(180deg);
    border-color:#3c5a99;
  }
  .card-face > div{max-width:100%;}
  .card-label{
    display:block;
    font-size:.7rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:12px;
    text-align:center;
  }
  .card-back .card-label{color:#7fd3ff;}
  .card-face p{
    font-size:clamp(1rem,2.5vw,1.18rem);
    text-align:center;
    font-weight:500;
  }
  .card-hint{
    text-align:center;color:var(--muted);font-size:.75rem;
    margin-top:8px;margin-bottom:14px;
  }

  .fc-controls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    flex-wrap:wrap;
  }
  .fc-controls button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 20px;
    border-radius:12px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .fc-controls button:hover{background:var(--surface2);border-color:var(--accent2);}
  .fc-controls button:disabled{opacity:.35;cursor:not-allowed;}
  #fcCounter{
    font-size:.85rem;color:var(--muted);font-weight:700;
    min-width:78px;text-align:center;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- QUIZ ---------- */
  .quiz-top{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-size:.82rem;color:var(--muted);font-weight:600;
  }
  .bar{height:7px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:22px;}
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    border-radius:99px;transition:width .35s ease;
  }
  .q-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px;
    margin-bottom:18px;
  }
  .q-tag{
    display:inline-block;
    font-size:.66rem;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--accent);font-weight:700;
    background:#f5b7311a;
    padding:4px 11px;border-radius:99px;margin-bottom:14px;
  }
  .q-text{font-size:1.05rem;font-weight:600;line-height:1.6;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:14px 18px;
    border-radius:12px;
    font-size:.92rem;
    text-align:left;
    cursor:pointer;
    transition:.18s;
    font-family:inherit;
    line-height:1.5;
    display:flex;gap:12px;align-items:flex-start;
  }
  .opt:hover:not(.locked){background:var(--surface2);border-color:var(--accent2);transform:translateX(3px);}
  .opt .letter{
    font-weight:800;color:var(--accent);flex-shrink:0;min-width:18px;
  }
  .opt.correct{background:#1e5c3a;border-color:var(--correct);}
  .opt.correct .letter{color:#8affc1;}
  .opt.wrong{background:#5c1e1e;border-color:var(--wrong);}
  .opt.wrong .letter{color:#ffb3b3;}
  .opt.locked{cursor:default;}

  .explain{
    margin-top:16px;
    background:#0e1330;
    border-left:3px solid var(--accent);
    padding:13px 16px;
    border-radius:0 10px 10px 0;
    font-size:.87rem;
    color:#c3caea;
    display:none;
  }
  .explain.show{display:block;animation:fade .25s ease;}
  .explain strong{color:var(--accent);}

  #nextQ{
    display:none;
    margin-top:18px;
    width:100%;
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    border:none;color:#fff;
    padding:14px;border-radius:12px;
    font-size:.95rem;font-weight:700;
    cursor:pointer;font-family:inherit;
    transition:.2s;
  }
  #nextQ:hover{filter:brightness(1.15);}
  #nextQ.show{display:block;}

  /* ---------- RESULTS ---------- */
  .result{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 26px;
    text-align:center;
    display:none;
  }
  .result.show{display:block;animation:fade .4s ease;}
  .score-ring{
    font-size:3.4rem;font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1.1;
  }
  .result h2{margin:10px 0 6px;font-size:1.3rem;}
  .result p{color:var(--muted);font-size:.9rem;margin-bottom:8px;}
  .result .msg{
    font-size:1rem;margin:18px 0 26px;color:var(--text);font-weight:600;
  }
  .result button{
    background:linear-gradient(135deg,var(--accent2),#5a3fd6);
    border:none;color:#fff;
    padding:13px 32px;border-radius:12px;
    font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;
    transition:.2s;
  }
  .result button:hover{filter:brightness(1.15);}

  @media(max-width:600px){
    .card{height:340px;}
    .card-face{padding:22px 18px;}
    .q-box{padding:20px 16px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>English 4 Reviewer</h1>
    <p>Literature · Mythology · Gilgamesh · Book of Job · Oedipus Rex · Business Writing</p>
  </header>

  <nav class="tabs">
    <button data-tab="flash" class="active">📇 Flashcards</button>
    <button data-tab="quiz">📝 Quiz</button>
  </nav>

  <!-- ============ FLASHCARDS ============ -->
  <section id="flash" class="panel active">
    <div class="deck-bar" id="deckBar"></div>
    <div class="card" id="card">
      <div class="card-inner">
        <div class="card-face card-front">
          <div>
            <span class="card-label">Question</span>
            <p id="fcQ">Loading…</p>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <span class="card-label">Answer</span>
            <p id="fcA"></p>
          </div>
        </div>
      </div>
    </div>
    <p class="card-hint">Click the card to flip · Use ← → keys to navigate</p>
    <div class="fc-controls">
      <button id="prevBtn">← Prev</button>
      <span id="fcCounter">1 / 1</span>
      <button id="nextBtn">Next →</button>
      <button id="shuffleBtn">🔀 Shuffle</button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="quiz" class="panel">
    <div id="quizArea">
      <div class="quiz-top">
        <span id="qProgress">Question 1 of 45</span>
        <span id="qScore">Score: 0</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="q-box">
        <span class="q-tag" id="qTag">Topic</span>
        <p class="q-text" id="qText"></p>
      </div>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain"></div>
      <button id="nextQ">Next Question →</button>
    </div>

    <div class="result" id="result">
      <div class="score-ring" id="scoreRing">0%</div>
      <h2 id="resultTitle">Quiz Complete!</h2>
      <p id="resultSub"></p>
      <p class="msg" id="resultMsg"></p>
      <button id="retryBtn">🔄 Retake Quiz</button>
    </div>
  </section>
</div>

<script>
/* =========================================================
   FLASHCARD DECKS
   ========================================================= */
const DECKS = {
  "Lit Basics": [
    {q:"Where does the word 'literature' come from?", a:"Latin littera, meaning 'letter.'"},
    {q:"What are the five forms of literature?", a:"Poetry, Drama, Prose, Oral Literature, and Media."},
    {q:"Which literary form is considered the oldest?", a:"Poetry — it existed through songs and spoken narratives before writing."},
    {q:"Novel vs. Short Story?", a:"Novel — longer, tackles complicated plots and storylines, often in chapters. Short Story — a single plot, all attention devoted to resolving it."},
    {q:"What is a memoir?", a:"A focused account of a specific aspect or period of a real person's life — a shorter, more focused biography."},
    {q:"What is an autobiography?", a:"A self-written life story."},
    {q:"What is a biography?", a:"A complete retelling of a person's life from birth to death."},
    {q:"Haiku structure and theme?", a:"Originally Japanese; three lines with a 5-7-5 syllable count; usually about nature and simple pleasures."},
    {q:"What is a sonnet?", a:"14 lines in iambic pentameter; from Italian meaning 'little sound or song'; Shakespeare's most-used form."},
    {q:"What is an epic?", a:"A long narrative poem detailing the adventures of a hero."},
    {q:"What is a ballad?", a:"A slow love song meant to be sung; typically 4–6 lines per stanza with a definite rhyming pattern."},
    {q:"What is a cinquain?", a:"A five-line poem that conveys a vivid image."},
    {q:"What is a lyric poem?", a:"Often accompanied by music; expresses one's feelings and does not necessarily include a narrative."},
    {q:"Fable vs. Myth?", a:"Fable — features personified animals as characters. Myth — about gods, goddesses, and supernatural characters with magical/fantastical elements."},
    {q:"What are the five types of essay?", a:"Narrative, Descriptive, Expository, Critical, and Persuasive."},
    {q:"Which form is unique because of how it is delivered?", a:"Oral Literature — it uses poetry's structure but its performative aspect makes it distinct."}
  ],

  "Mythology": [
    {q:"What does 'myth' mean?", a:"From Greek mythos = 'story' or 'tale'; an ancient narrative explaining natural events, origins, or practices."},
    {q:"What are the three types of myths?", a:"Etiological, Historical, and Psychological."},
    {q:"What is an etiological myth?", a:"One that explains the origin of a place, object, or concept — from the Greek word for 'reason.'"},
    {q:"Who said 'Myths teach meaning'?", a:"Joseph Campbell, American professor of literature."},
    {q:"Who wrote Theogony and when?", a:"Hesiod, around 700 BC — the first written cosmogony in Greek mythology."},
    {q:"What are the four primordial beings?", a:"Chaos (the gap), Gaea (earth), Tartarus (abyss), and Eros (love)."},
    {q:"Who were Cronus and Rhea's children?", a:"Hestia, Demeter, Hera, Hades, Poseidon, and Zeus."},
    {q:"How was Aphrodite born?", a:"From the sea after Cronus castrated Uranus and threw the severed part into the ocean."},
    {q:"How was Athena born?", a:"Zeus swallowed Metis; Athena emerged fully grown and dressed for war from Zeus' forehead."},
    {q:"What was the Titanomachy?", a:"The war between the Titans (led by Atlas) and the gods (led by Zeus). Zeus won."},
    {q:"What did Prometheus do, and what was his punishment?", a:"He gave fire to mankind (meant only for gods); he was chained to a mountain for a vulture to peck out his liver daily."},
    {q:"What did Pandora release from the box?", a:"All evils — pain, sickness, envy, greed, and other horrors — but also hope."},
    {q:"What is Zeus' identity and symbols?", a:"King of all gods; symbols: eagle, lightning, thunderbolt, and scepter."},
    {q:"What is Poseidon's identity and symbols?", a:"God of the sea, floods, drought, and horses; symbols: trident, horses, dolphins."},
    {q:"What is Athena's identity and symbols?", a:"Goddess of wisdom, warfare, and handicrafts; symbols: olive tree, owl, spear, shield."},
    {q:"What is Aphrodite's identity and symbols?", a:"Goddess of love and beauty; symbols: myrtle wreath, apple, scallop shell, dove."},
    {q:"What were the three categories of Ancient Greek mythology?", a:"Religious myths, Legends or sagas, and Folktales."},
    {q:"Who were the three great tragic playwrights of Athens?", a:"Aeschylus, Sophocles, and Euripides."}
  ],

  "Archetypes": [
    {q:"What is an archetype?", a:"A story element meant to inject something universally human into the reading, viewing, or listening experience."},
    {q:"Who introduced the 'collective unconscious'?", a:"Psychologist Carl Jung."},
    {q:"What are the five common character archetypes?", a:"The Hero, The Villain, The Antihero, The Everyman, and The Trickster/Jester."},
    {q:"Describe the Hero archetype.", a:"Comes from ordinary life but is called to adventure; confronts their darkest fear in order to transform and overcome conflict."},
    {q:"Describe the Villain archetype.", a:"Known for being evil; motivations become clear (fear or pursuit of power); their main vice parallels the hero's main virtue."},
    {q:"Describe the Antihero.", a:"Has heroic attributes but is not as conventionally 'good' as a hero — e.g., Wolverine."},
    {q:"Describe the Everyman.", a:"A normal person facing extraordinary circumstances; does not feel obligated to save the world — simply wants to survive."},
    {q:"Describe the Trickster/Jester.", a:"Flexible; can be good or evil; breaks society's (even nature's) rules and laughs at terrifying things — e.g., Bugs Bunny."},
    {q:"What are the five situational archetypes?", a:"Journeys, Good vs. Evil, Natural vs. Mechanistic World, Death and Rebirth, and Rags to Riches."},
    {q:"Give an example of Death and Rebirth.", a:"The Lion King — a cub's baptism, an adult lion's death, and the cub growing up to take over leadership."},
    {q:"Give an example of Rags to Riches.", a:"The Princess Diaries — a nerdy schoolgirl transforms into a long-lost princess."},
    {q:"Give an example of Natural vs. Mechanistic World.", a:"Wall-E — an emotionally intelligent robot compacts garbage while humanity waits in a spaceship."},
    {q:"What archetypal elements are commonly used?", a:"Unique births, mysteries, extraordinary powers, tragic flaws, rites of passage, and nemeses."}
  ],

  "Gilgamesh": [
    {q:"Who was Gilgamesh?", a:"King of Uruk who ruled around 2700 BC; the epic is based on the legendary adventures attributed to him."},
    {q:"What is the earliest surviving great work of literature?", a:"The Epic of Gilgamesh — an ancient Mesopotamian odyssey."},
    {q:"Who rediscovered the complete version, and when?", a:"British archaeologist Austen Layard in 1839, in Nineveh (the library of Ashurbanipal)."},
    {q:"Who wrote the Akkadian version?", a:"Babylonian writer Shin-Leqi-Unninni (1300–1000 BCE)."},
    {q:"What is the oldest existing version of the epic?", a:"The one dating back to 2000 BC in Sumerian cuneiform."},
    {q:"Who was Enkidu?", a:"A hairy wild man created by the gods to challenge Gilgamesh; he became Gilgamesh's closest friend."},
    {q:"Who was Humbaba?", a:"The monster in the Cedar Forest whom Gilgamesh and Enkidu fight."},
    {q:"Who was Utnapishtim?", a:"The flood hero granted immortality by the gods; he tells Gilgamesh the secrets of the gods."},
    {q:"Who was Urshanabi?", a:"The boatman who leads Gilgamesh to Uruk at the end of the epic."},
    {q:"What two secrets did Utnapishtim reveal?", a:"1) The gods planned to destroy humanity by a flood. 2) The secret of immortality, which was granted to Utnapishtim."},
    {q:"What did Gilgamesh learn about eternal life?", a:"That true immortality is not living forever — it is the lasting legacy of one's works (like the walls of Uruk)."},
    {q:"How is Gilgamesh described at the start of the epic?", a:"Tyrannical, cruel, and arrogant."},
    {q:"Why did the gods allow Enkidu to challenge Gilgamesh?", a:"Because Gilgamesh abused the people of Uruk."},
    {q:"What happened after Enkidu's death?", a:"Gilgamesh grieved deeply and resolved to discover the secret of immortality."},
    {q:"How does the Gilgamesh flood compare to Noah's flood?", a:"Both feature a divine decision to flood the world, a chosen survivor, a boat, birds sent out to find land, a sacrifice, and gods who regret the destruction."},
    {q:"What city did Gilgamesh rule?", a:"Uruk."},
    {q:"What does the Gilgamesh story teach about life?", a:"Our lives are defined not just by ourselves or the gods, but also by the people we meet along the way."}
  ],

  "Book of Job": [
    {q:"Who wrote the Book of Job?", a:"An anonymous non-Israelite from the land of Uz, southeast of ancient Israel."},
    {q:"Where is the Book of Job located in the biblical canon?", a:"In the Ketuvim ('writings'), the third section of the biblical canon."},
    {q:"How does God describe Job?", a:"Blameless and upright, one who fears God and turns away from evil — 'there is none like him on the earth.'"},
    {q:"How many children did Job originally have?", a:"Seven sons and three daughters."},
    {q:"What was Job's initial wealth?", a:"7,000 sheep, 3,000 camels, 500 yoke of oxen, 500 female donkeys, and a very large household."},
    {q:"What title did Job hold among the people of the East?", a:"He was 'the greatest man among all the people of the East.'"},
    {q:"Who challenged Job's faith in heaven?", a:"Satan (the accuser), who appeared among the 'sons of God.'"},
    {q:"What was the wager between God and Satan?", a:"Satan claimed Job only feared God because of blessings; God permitted Satan to test Job but forbade taking his life."},
    {q:"What were the four calamities that struck Job?", a:"1) Sabeans stole his oxen and donkeys. 2) Fire from heaven burned his sheep. 3) Chaldeans stole his camels. 4) A great wind collapsed the house, killing all ten children."},
    {q:"How did Job respond to the first calamities?", a:"He tore his robe, shaved his head, fell to the ground and worshipped: 'The Lord gave, and the Lord has taken away; blessed be the name of the Lord.'"},
    {q:"How did Satan torment Job's body?", a:"With severe boils from the soles of his feet to the crown of his head."},
    {q:"What did Job's wife tell him?", a:"'Do you still hold fast to your integrity? Curse God and die!'"},
    {q:"How did Job answer his wife?", a:"'You speak as one of the foolish women would speak. Shall we receive good from God, and shall we not receive evil?' — In all this Job did not sin with his lips."},
    {q:"Who were Job's three friends?", a:"Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite."},
    {q:"How long did Job's friends sit with him in silence?", a:"Seven days and seven nights, because they saw his suffering was very great."},
    {q:"What did Bildad compare Job's children to?", a:"Death."},
    {q:"What did Job call his friends?", a:"'Miserable comforters.'"},
    {q:"How did God speak to Job?", a:"Through a whirlwind."},
    {q:"What key statement does Job make in Job 42:2?", a:"'I know that you can do all things, and that no purpose of yours can be thwarted.'"},
    {q:"When did God restore Job's fortunes?", a:"After Job prayed for his friends."},
    {q:"What was Job's wealth after restoration?", a:"14,000 sheep, 6,000 camels, 1,000 yoke of oxen, and 1,000 female donkeys — double his original wealth."},
    {q:"What were the names of Job's daughters after his restoration?", a:"Jemimah, Keziah, and Keren-Happuch — the most beautiful women in all the land."},
    {q:"What unusual thing did Job do for his daughters?", a:"He gave them an inheritance along with their brothers."},
    {q:"How long did Job live after his restoration?", a:"140 more years; he saw four generations of descendants and died old and full of days."},
    {q:"Who did God rebuke at the end of the book?", a:"Job's three friends — they had defended God but spoken falsely about Him."},
    {q:"What is the main theme of the Book of Job?", a:"Theodicy — why good people suffer; faith and steadfastness in the midst of suffering."},
    {q:"What did Job value more than anything else?", a:"The word of God."},
    {q:"What is the main idea about living in the midst of struggles?", a:"Never lose faith in your ability to overcome it."}
  ],

  "Oedipus Rex": [
    {q:"Who wrote Oedipus Rex?", a:"Sophocles (c. 496–406 BCE), one of classical Athens' three great tragic playwrights."},
    {q:"What does the name 'Oedipus' mean?", a:"'Swollen foot.'"},
    {q:"What is the Latin title, and what does Tyrannos mean?", a:"Oedipus Tyrannos — 'Tyrannos' signifies the throne was not gained through inheritance."},
    {q:"When and where was Oedipus Rex performed?", a:"5th century BCE; first runner-up in 429 BC at the festival of Dionysus in Athens, Greece."},
    {q:"What is the cause of the plague in Thebes?", a:"The undiscovered murderer of the old king, Laius, who must be exiled."},
    {q:"Where was Oedipus left for dead as a baby?", a:"On Mount Cithaeon."},
    {q:"Who reveals the truth to Oedipus?", a:"Tiresias, the blind prophet — he knows the true nature of Oedipus."},
    {q:"Why does Jocasta try to stop Oedipus from speaking to the shepherd?", a:"Because she already knew the truth and knew Oedipus would be destroyed."},
    {q:"What punishment does Oedipus receive?", a:"He blinds himself and exiles himself."},
    {q:"Who becomes ruler of Thebes at the end?", a:"Creon, Jocasta's brother."},

/* =========================================================
   FLASHCARD LOGIC
   ========================================================= */
const deckBar = document.getElementById('deckBar');
const cardEl = document.getElementById('card');
const fcQ = document.getElementById('fcQ');
const fcA = document.getElementById('fcA');
const fcCounter = document.getElementById('fcCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

let currentDeck = Object.keys(DECKS)[0];
let cardList = [...DECKS[currentDeck]];
let cardIndex = 0;

function buildDeckBar(){
  deckBar.innerHTML = '';
  Object.keys(DECKS).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name + ' (' + DECKS[name].length + ')';
    if(name === currentDeck) b.classList.add('active');
    b.addEventListener('click', () => {
      currentDeck = name;
      cardList = [...DECKS[name]];
      cardIndex = 0;
      buildDeckBar();
      renderCard();
    });
    deckBar.appendChild(b);
  });
}

function renderCard(){
  cardEl.classList.remove('flipped');
  const c = cardList[cardIndex];
  fcQ.textContent = c.q;
  fcA.textContent = c.a;
  fcCounter.textContent = (cardIndex + 1) + ' / ' + cardList.length;
  prevBtn.disabled = cardIndex === 0;
  nextBtn.disabled = cardIndex === cardList.length - 1;
}

cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
prevBtn.addEventListener('click', () => { if(cardIndex > 0){ cardIndex--; renderCard(); }});
nextBtn.addEventListener('click', () => { if(cardIndex < cardList.length - 1){ cardIndex++; renderCard(); }});
shuffleBtn.addEventListener('click', () => {
  for(let i = cardList.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cardList[i], cardList[j]] = [cardList[j], cardList[i]];
  }
  cardIndex = 0;
  renderCard();
});

document.addEventListener('keydown', e => {
  if(!document.getElementById('flash').classList.contains('active')) return;
  if(e.key === 'ArrowLeft'){ prevBtn.click(); }
  if(e.key === 'ArrowRight'){ nextBtn.click(); }
  if(e.key === ' '){ e.preventDefault(); cardEl.classList.toggle('flipped'); }
});

const resultTitle = document.getElementById('resultTitle');

let quizOrder = [];
let qIndex = 0;
let score = 0;
let answered = false;

function initQuiz(){
  quizOrder = QUIZ.map((q, i) => i);
  for(let i = quizOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [quizOrder[i], quizOrder[j]] = [quizOrder[j], quizOrder[i]];
  }
  qIndex = 0; score = 0; answered = false;
  quizArea.style.display = 'block';
  resultEl.classList.remove('show');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = QUIZ[quizOrder[qIndex]];
  qTag.textContent = q.t;
  qText.textContent = q.q;
  qProgress.textContent = 'Question ' + (qIndex + 1) + ' of ' + quizOrder.length;
  qScore.textContent = 'Score: ' + score;
  barFill.style.width = ((qIndex) / quizOrder.length * 100) + '%';
  explainEl.classList.remove('show');
  explainEl.innerHTML = '';
  nextQ.classList.remove('show');
  nextQ.textContent = (qIndex === quizOrder.length - 1) ? 'See Results →' : 'Next Question →';

  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', () => selectAnswer(i));
    optsEl.appendChild(btn);
  });
}

function selectAnswer(choice){
  if(answered) return;
  answered = true;
  const q = QUIZ[quizOrder[qIndex]];
  const buttons = optsEl.querySelectorAll('.opt');

  buttons.forEach((b, i) => {
    b.classList.add('locked');
    if(i === q.c) b.classList.add('correct');
    if(i === choice && choice !== q.c) b.classList.add('wrong');
  });

  if(choice === q.c){
    score++;
    qScore.textContent = 'Score: ' + score;
  }

  explainEl.innerHTML = '<strong>' + (choice === q.c ? '✓ Correct!' : '✗ Not quite.') + '</strong> ' + q.e;
  explainEl.classList.add('show');
  nextQ.classList.add('show');
}

nextQ.addEventListener('click', () => {
  if(qIndex < quizOrder.length - 1){
    qIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizArea.style.display = 'none';
  resultEl.classList.add('show');
  const pct = Math.round(score / quizOrder.length * 100);
  scoreRing.textContent = pct + '%';
  resultSub.textContent = 'You got ' + score + ' out of ' + quizOrder.length + ' correct.';

  let msg = '';
  if(pct === 100) msg = '🏆 Perfect score! You have mastered this material.';
  else if(pct >= 85) msg = '⭐ Excellent work! Just a few details to review.';
  else if(pct >= 70) msg = '👍 Good job! Review the missed items and try again.';
  else if(pct >= 50) msg = '📖 Fair. Go back to the flashcards and retake the quiz.';
  else msg = '💪 Keep studying! Use the flashcards to strengthen your recall.';
  resultMsg.textContent = msg;
  resultTitle.textContent = 'Quiz Complete!';
}

document.getElementById('retryBtn').addEventListener('click', initQuiz);

/* =========================================================
   TABS
   ========================================================= */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* =========================================================
   INIT
   ========================================================= */
buildDeckBar();
renderCard();
initQuiz();
</script>
</body>
</html>
